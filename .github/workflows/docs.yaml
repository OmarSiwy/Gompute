name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege plus what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The same build build.zig.zon, flake.lock and test.yaml pin; the three
      # move together.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.18.0-dev.349+d924f83bf

      # One command builds the whole site: the landing page, every docs/*.md
      # rendered by tools/md2html.zig, and the generated API reference. No
      # system Markdown tool, so CI and a local `zig build docs` produce the
      # same output. It never calls emitKernels, so it needs no GPU or driver.
      - name: Build the documentation site
        run: zig build docs

      # A silently empty or half-assembled site deploys just as happily as a
      # complete one, so check before handing it to Pages.
      - name: Sanity-check the output
        run: |
          set -euo pipefail
          for f in zig-out/docs/index.html zig-out/docs/style.css zig-out/docs/api/index.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          for md in docs/*.md; do
            page="zig-out/docs/$(basename "$md" .md).html"
            test -s "$page" || { echo "unrendered: $md"; exit 1; }
            if grep -q '$body$' "$page"; then
              echo "template not substituted: $page"; exit 1
            fi
          done
          # Derived from docs/, not hardcoded, so adding a page cannot leave
          # the landing page silently unlinked.
          for md in docs/*.md; do
            link="$(basename "$md" .md).html"
            grep -q "href=\"$link\"" zig-out/docs/index.html \
              || { echo "index.html does not link to $link"; exit 1; }
          done
          # Every font the stylesheet asks for must actually be installed.
          for font in $(grep -o 'fonts/[a-z0-9.-]*\.woff2' docs/style.css | sort -u); do
            test -s "zig-out/docs/$font" || { echo "missing font: $font"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: zig-out/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
